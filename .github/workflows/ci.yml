name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu x86_64)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libzstd-dev python3-pip
          python3 -m pip install --upgrade numpy scipy numba zstandard

      - name: Install dependencies (macOS ARM64)
        if: runner.os == 'macOS'
        run: |
          brew install zstd
          python3 -m pip install --upgrade numpy scipy numba zstandard

      - name: Build all C++20 targets (0 warnings)
        run: make all

      - name: Run full test, UBSan, NEON/scalar parity, and fuzz verification
        run: make test

      - name: Cross-architecture decode sanity (deterministic synthetic stream)
        run: |
          python3 - << 'EOF'
          import hashlib, subprocess, numpy as np
          rng = np.random.default_rng(2026)
          cube = rng.integers(-4000, 4000, size=(32, 48, 48), dtype="<i2")
          cube.tofile("/tmp/ci_cube.raw")
          for k in ("0", "6"):
              subprocess.run(
                  ["./hnd3", "enc", "/tmp/ci_cube.raw", f"/tmp/ci_k{k}.hnd3",
                   "--shape", "32,48,48", "--dtype", "i16", "--base-k", k],
                  check=True,
              )
              subprocess.run(["./hnd3", "dec", f"/tmp/ci_k{k}.hnd3", f"/tmp/ci_k{k}.raw"], check=True)
              assert open(f"/tmp/ci_k{k}.raw", "rb").read() == cube.tobytes()
              print(f"k={k} compressed sha256:", hashlib.sha256(open(f"/tmp/ci_k{k}.hnd3", "rb").read()).hexdigest())
          # HND4 tiled + near-lossless cross-arch sanity
          subprocess.run(
              ["./hnd3", "enc", "/tmp/ci_cube.raw", "/tmp/ci_tiled.hnd4",
               "--shape", "32,48,48", "--dtype", "i16", "--base-k", "6", "--tile-size", "24"],
              check=True,
          )
          subprocess.run(["./hnd3", "dec", "/tmp/ci_tiled.hnd4", "/tmp/ci_tiled.raw"], check=True)
          assert open("/tmp/ci_tiled.raw", "rb").read() == cube.tobytes()
          print("hnd4 tiled sha256:", hashlib.sha256(open("/tmp/ci_tiled.hnd4", "rb").read()).hexdigest())
          EOF

  fuzz-asan-ubsan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Clang, libzstd, and Python deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libzstd-dev python3-pip
          python3 -m pip install --upgrade numpy zstandard

      - name: Build production tools and libFuzzer+ASan+UBSan targets
        run: |
          make asv4 libhnd3.a hnd3
          make fuzz FUZZ_CXX=clang++

      - name: Run coverage-guided libFuzzer + ASan + UBSan smoke campaign (HND3/HND4 + ASV4)
        run: |
          mkdir -p /tmp/ci_corp_hnd3 /tmp/ci_corp_asv4
          python3 - << 'EOF'
          import hashlib, struct, subprocess, numpy as np, zstandard as zstd
          rng = np.random.default_rng(7)
          c = rng.integers(-1000, 1000, (8, 16, 16), dtype="<i2")
          c.tofile("/tmp/ci_s.raw")
          subprocess.run(["./hnd3", "enc", "/tmp/ci_s.raw", "/tmp/ci_corp_hnd3/v3.hnd3", "--shape", "8,16,16", "--dtype", "i16", "--base-k", "6", "--threads", "1"], check=True)
          subprocess.run(["./hnd3", "enc", "/tmp/ci_s.raw", "/tmp/ci_corp_hnd3/v4.hnd4", "--shape", "8,16,16", "--dtype", "i16", "--base-k", "6", "--tile-size", "8", "--max-error", "2", "--threads", "1"], check=True)
          open("/tmp/ci_a.raw", "wb").write(b"ASV4 CI fuzz seed! " * 200)
          subprocess.run(["./asv4", "c", "/tmp/ci_a.raw", "/tmp/ci_corp_asv4/t0.asv4", "--level", "3"], check=True)
          for name, tid, w, h, xlen, tlen in [
              ("t1", 1, 4, 0, 256, 3), ("t2_elem", 2, 4, 0, 256, 1), ("t2_xor", 3, 8, 0, 256, 5),
              ("t2_bit", 4, 4, 0, 512, 2), ("t3_2d", 5, 4, 16, 256, 0), ("t2_nib", 6, 4, 0, 256, 2),
          ]:
              orig_len = xlen + tlen
              meta = struct.pack("<IBBHHHIQ", orig_len, tid, 0, w, h, 0, tlen, 0)
              cm = zstd.ZstdCompressor(level=1).compress(meta)
              cr = zstd.ZstdCompressor(level=1).compress(bytes(tlen)) if tlen else b""
              cx = zstd.ZstdCompressor(level=1).compress(bytes((i * 37) & 0xFF for i in range(xlen)))
              blob = struct.pack("<4sBBH", b"ASV3", 4, 20, 0) + struct.pack("<B5I", 1, orig_len, len(cm), len(cr), len(cx), 0) + cm + cr + cx
              blob += struct.pack("<B4I", 0xFF, 0, 0, 0, 0) + struct.pack("<Q", orig_len) + hashlib.sha256(b"x").digest()
              open(f"/tmp/ci_corp_asv4/{name}.asv4", "wb").write(blob)
          EOF
          /tmp/fuzz_hnd3 /tmp/ci_corp_hnd3 -max_total_time=20 -max_len=16384 -print_final_stats=1
          /tmp/fuzz_asv4 /tmp/ci_corp_asv4 -max_total_time=20 -max_len=16384 -print_final_stats=1
